<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de LRC Definitivo</title>
</head>
<body>

    <h1>LRC Maker</h1>
    <p>Suba seu .srt, o código corta o lixo entre o colchete e a letra, remove repetições e ajusta tudo.</p>

    <div>
        <div>
            <label><strong>1. Enviar arquivo .srt:</strong></label><br>
            <input type="file" id="inputFile" accept=".srt,.txt" onchange="carregarArquivo(event)">
        </div>
        <br>
        <div>
            <label><strong>2. Visualizar / Editar texto:</strong></label><br>
            <textarea id="inputTexto" rows="10" cols="80" placeholder="O conteúdo do seu SRT aparecerá aqui após o upload (ou você pode colar manualmente)..."></textarea>
        </div>
        <br>
        <button onclick="converterTexto()">🚀 CONVERTER E GERAR LRC</button>
        <br><br>
        <a id="downloadLink" download="legenda.lrc" style="display:none;">📥 BAIXAR ARQUIVO .LRC</a>
        <br><br>
        <div>
            <label><strong>Pré-visualização do resultado limpo:</strong></label><br>
            <textarea id="outputTexto" rows="10" cols="80" readonly></textarea>
        </div>
    </div>

    <script>
        function carregarArquivo(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();
            leitor.onload = function(e) {
                document.getElementById('inputTexto').value = e.target.result;
                let nomeBase = arquivo.name.replace(/\.[^/.]+$/, "");
                document.getElementById('downloadLink').setAttribute('download', nomeBase + '.lrc');
            };
            leitor.readAsText(arquivo, 'UTF-8');
        }

        function converterTexto() {
            let texto = document.getElementById('inputTexto').value;

            if (!texto.trim()) {
                alert("Envie um arquivo ou cole o texto primeiro!");
                return;
            }

            // Normaliza quebras de linha gerais do SRT
            texto = texto.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

            // PASSO 1: Modelagem e Tempo (srt para lrc [mm:ss.xx])
            texto = texto.replace(/[0-9]+\n[0-9]{2}:([0-9]{2}:[0-9]{2}),([0-9]{2})[0-9].*\n(.*?)(?:\n|$)/g, '[$1.$2] $3\n');

            // PASSO 2: A Solução Definitiva! Apaga tudo entre o [tempo] e a primeira letra (A-Z com acentos), deixando 1 espaço
            texto = texto.replace(/(\[[0-9]{2}:[0-9]{2}\.[0-9]{2}\])[^A-Za-zÀ-ÿ]*(.*)/g, '$1 $2');

            // PASSO 3: Lógica de remoção de linhas duplicadas consecutivas e limpeza de espaços internos
            let linhas = texto.split('\n');
            let linhasFiltradas = [];

            for (let i = 0; i < linhas.length; i++) {
                let linhaAtual = linhas[i].trim();
                if (!linhaAtual) continue;
                
                // Normaliza múltiplos espaços internos na linha
                linhaAtual = linhaAtual.replace(/([ \t]{2,})/g, ' ');

                let conteudoAtual = linhaAtual.replace(/^\[[0-9]{2}:[0-9]{2}\.[0-9]{2}\]\s*/, '');
                
                if (linhasFiltradas.length === 0) {
                    linhasFiltradas.push(linhaAtual);
                } else {
                    let ultimaLinhaSalva = linhasFiltradas[linhasFiltradas.length - 1];
                    let conteudoUltima = ultimaLinhaSalva.replace(/^\[[0-9]{2}:[0-9]{2}\.[0-9]{2}\]\s*/, '');

                    if (conteudoAtual !== conteudoUltima) {
                        linhasFiltradas.push(linhaAtual);
                    }
                }
            }

            let resultadoFinal = linhasFiltradas.join('\n').trim();

            // Mostra na tela
            document.getElementById('outputTexto').value = resultadoFinal;

            // Prepara o botão de download automático
            let blob = new Blob([resultadoFinal], { type: 'text/plain;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            let linkDownload = document.getElementById('downloadLink');
            linkDownload.href = url;
            linkDownload.style.display = 'inline';
            
            alert("Conversão concluída com sucesso! Clique no link para baixar o seu .lrc.");
        }
    </script>
</body>
</html>
