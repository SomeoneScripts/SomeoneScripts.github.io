<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player de Transmissão Multi-Canais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }
        .channel-select {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        .channel-select:hover {
            border-color: #38bdf8;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Aspect Ratio 16:9 */
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="channel-title">ESPN — Transmissão</h1>
            
            <!-- Menu para seleção dos canais -->
            <select id="channelSelector" class="channel-select" onchange="changeChannel()">
                <option value="https://sporturbo.com/player/canais/dspl-espn">ESPN</option>
                <option value="https://sporturbo.com/player/canais/dspl-espn2">ESPN 2</option>
                <option value="https://sporturbo.com/player/canais/dspl-espn3">ESPN 3</option>
                <option value="https://sporturbo.com/player/canais/dspl-espn4">ESPN 4</option>
                <option value="https://sporturbo.com/player/canais/dspl-sportv">SporTV</option>
                <option value="https://sporturbo.com/player/canais/dspl-sportv2">SporTV 2</option>
                <option value="https://sporturbo.com/player/canais/dspl-sportv3">SporTV 3</option>
            </select>
        </div>

        <div class="player-wrapper">
            <iframe 
                id="mainPlayer"
                marginheight="0" 
                marginwidth="0" 
                src="https://sporturbo.com/player/canais/dspl-espn" 
                scrolling="no" 
                allowfullscreen="yes" 
                allow="encrypted-media; picture-in-picture;" 
                width="100%" 
                height="100%" 
                frameborder="0">
            </iframe>
        </div>
    </div>

    <script>
        function changeChannel() {
            const selector = document.getElementById('channelSelector');
            const player = document.getElementById('mainPlayer');
            const title = document.getElementById('channel-title');
            
            // Atualiza a URL do iframe
            player.src = selector.value;
            
            // Atualiza o título do canal exibido no topo
            const selectedText = selector.options[selector.selectedIndex].text;
            title.textContent = `${selectedText} — Transmissão`;
        }
    </script>

</body>
</html>
